<!DOCTYPE html>
<html lang="en">

<head>
    <title>Create Your Account</title>
</head>

<body>

    <form class="card">

        <h4>Get Started</h4>
        <h1>Create your Workspace</h1>

        <div class="card-body">

            <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="ifty islam ">
            </div>

            <div class="field">
                <label for="phone">Phone number</label>
                <input type="number" id="phone" placeholder="017******">
            </div>

            <div class="field">
                <label for="dob">Date of birth</label>
                <input type="date" id="dob" placeholder="25/06/2026">
            </div>

            <div class="field">
                <label for="email">Work email</label>
                <input type="email" id="email" placeholder="ifti@company.com">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters">
            </div>
            <label class="check">
                <input type="checkbox" checked>
                <span>Email me product updates and tips</span>
            </label>

            <br>

            <label class="check">
                <input type="checkbox">
                <span>I agree to the Terms &amp; Privacy Policy</span>
            </label>

            <br><br>

            <div class="buttons">
                <button type="submit" class="btn-primary">
                    Create workspace
                </button>

                <button type="reset" class="btn-secondary">
                    Reset
                </button>
            </div>

        </div>

    </form>

</body>

</html>
