<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration Page</title>
</head>

<body>

    <form class="card">

        <h1>Registration</h1>
        <p>Please complete all fields below.</p>

        <hr>

        <div class="card-body">

            <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Jane Doe">
            </div>

            <div class="field">
                <label for="postal">Postal Code</label>
                <input type="number" id="postal" placeholder="10001">
            </div>

            <div class="field">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" value="2026-06-25">
            </div>

            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="jane@example.com">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters">
            </div>

            <div class="field">
                <label for="country">Country</label>
                <select id="country">
                    <option>Select a country...</option>
                    <option>Bangladesh</option>
                    <option>India</option>
                    <option>Pakistan</option>
                    <option>United States</option>
                    <option>United Kingdom</option>
                </select>
            </div>



            <div class="buttons">
                <button type="submit" class="btn-primary">
                    Submit
                </button>

                <button type="reset" class="btn-secondary">
                    Reset
                </button>
            </div>

        </div>

    </form>

</body>

</html>
